# DocSearch configuration file
# Format: key = value     (lines starting with # are comments)
# Every setting can also be changed from the Settings menu (option 9) or
# on the command line with  --set key=value

# ---- input -------------------------------------------------------------
# A folder of .txt/.html files, or a TREC file with many <DOC> blocks.
data_dir                = data/cranfield/cran.all.1400.xml
recursive               = 1
stopword_file           = data/stopwords.txt

# ---- text processing (rebuild the index after changing) ----------------
use_stopwords           = 1
use_stemming            = 1

# ---- index & ranking -----------------------------------------------------
# dict_type: hash | sorted | list        model: tf | tfidf | bm25
dict_type               = hash
model                   = bm25
bm25_k1                 = 1.20
bm25_b                  = 0.75
top_k                   = 10
max_wildcard_expansions = 50

# ---- presentation --------------------------------------------------------
show_snippets           = 1
snippet_words           = 24
# ANSI colour highlighting (set to 0 if you see codes like [1;33m)
color                   = 1

# ---- output files --------------------------------------------------------
output_dir              = output
index_file              = output/index.dsx
report_file             = output/report.txt
results_csv             = output/search_results.csv

# ---- evaluation (Cranfield queries + relevance judgements) -------------
queries_file            = data/cranfield/cran.qry.xml
qrels_file              = data/cranfield/cranqrel.trec.txt
eval_k                  = 10

# ---- web GUI -------------------------------------------------------------
gui_port                = 8080
